<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f4f6fb;
        }
        * { box-sizing: border-box; }
        body { margin: 0; }
        header { background: #172033; color: white; }
        nav, main { width: min(960px, calc(100% - 2rem)); margin: 0 auto; }
        nav { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        nav a { color: white; text-decoration: none; }
        .brand { font-weight: 700; font-size: 1.1rem; }
        .nav-link { padding: .55rem .8rem; border: 1px solid #657089; border-radius: .5rem; }
        main { padding: 2rem 0; }
        .card { background: white; border: 1px solid #e2e7f0; border-radius: .8rem; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 3px 12px #1720330a; }
        h1 { margin: 0 0 1.25rem; font-size: clamp(1.6rem, 4vw, 2rem); }
        h2 { margin-top: 0; font-size: 1.15rem; }
        .button { display: inline-block; border: 0; border-radius: .5rem; padding: .65rem .9rem; background: #3157d5; color: white; text-decoration: none; font: inherit; cursor: pointer; }
        .button-secondary { background: #e9edf5; color: #172033; }
        .button-danger { background: #bd2d3a; }
        .actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
        .muted { color: #657089; }
        .summary { font-size: 1.5rem; font-weight: 700; }
        .filters { display: flex; flex-wrap: wrap; align-items: end; gap: .75rem; }
        label { display: block; margin-bottom: .35rem; font-weight: 600; }
        input, select { max-width: 100%; border: 1px solid #cbd3e1; border-radius: .45rem; padding: .65rem; font: inherit; }
        .form-field { margin-bottom: 1rem; }
        .errorlist { color: #a21d2a; margin: .35rem 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: .8rem .55rem; border-bottom: 1px solid #e8ebf2; vertical-align: middle; }
        th { color: #657089; font-size: .85rem; }
        td:last-child, th:last-child { text-align: right; }
        .category-list { display: flex; flex-wrap: wrap; gap: .5rem 1rem; margin: 0; padding: 0; list-style: none; }
        @media (max-width: 600px) {
            .table-wrap { overflow-x: auto; }
            th, td { padding: .7rem .4rem; }
            .actions { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a class="brand" href="{% url 'expense_list' %}">Expense Tracker</a>
            <a class="nav-link" href="{% url 'expense_add' %}">Add expense</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
