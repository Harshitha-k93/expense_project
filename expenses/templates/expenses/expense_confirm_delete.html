{% extends "expenses/base.html" %}

{% block title %}Delete expense · Expense Tracker{% endblock %}

{% block content %}
    <h1>Delete expense</h1>
    <section class="card">
        <p>Are you sure you want to delete <strong>{{ expense.title }}</strong> ({{ expense.amount|floatformat:2 }})?</p>
        <form method="post" class="actions">
            {% csrf_token %}
            <button class="button button-danger" type="submit">Delete expense</button>
            <a class="button button-secondary" href="{% url 'expense_list' %}">Cancel</a>
        </form>
    </section>
{% endblock %}
